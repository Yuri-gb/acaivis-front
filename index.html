<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />
    <title>Açaívis</title>

    <link
        rel="shortcut icon"
        href="/src/assets/images/icons/acaivis-favicon.ico"
        type="image/x-icon"
    >

    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body { background: #100d1d; }

        #initial-loader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            width: 100%;
            height: 100vh;
            background: #100d1d;
            color: #fff;
            overflow-y: auto;
            overflow-x: hidden;
            opacity: 1;
            visibility: visible;
            transition: opacity .25s ease, visibility .25s ease;
        }

        #initial-loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #initial-loader .loading-skeleton-page {
            width: 100%;
            min-height: 100%;
            background: #100d1d;
            overflow: hidden;
        }

        /* =========================================================
           BASE / SHIMMER
           ========================================================= */

        #initial-loader .skeleton {
            position: relative;
            display: block;
            overflow: hidden;
            background: rgba(255,255,255,.075);
            border-radius: 8px;
        }

        #initial-loader .skeleton::after {
            content: "";
            position: absolute;
            inset: 0;
            transform: translateX(-100%);
            background:
                linear-gradient(
                    90deg,
                    transparent 0%,
                    rgba(255,255,255,.025) 35%,
                    rgba(160,32,240,.12) 50%,
                    rgba(255,255,255,.025) 65%,
                    transparent 100%
                );
            animation: skeleton-shimmer 1.45s ease-in-out infinite;
        }

        @keyframes skeleton-shimmer {
            100% { transform: translateX(100%); }
        }


        /* =========================================================
           NAVBAR
           Baseado no .navbar real:
           80px / padding 55px / logo 125px / links 30px.
           ========================================================= */

        #initial-loader .skeleton-navbar {
            position: relative;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 80px;
            padding: 0 55px;
            background:
                linear-gradient(
                    90deg,
                    #09000f,
                    #1b0028,
                    #09000f
                );
        }

        #initial-loader .skeleton-navbar-logo {
            width: 125px;
            height: 34px;
            border-radius: 7px;
            flex-shrink: 0;
        }

        #initial-loader .skeleton-navbar-links {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-left: auto;
            margin-right: 35px;
        }

        #initial-loader .skeleton-navbar-links span {
            width: 43px;
            height: 10px;
            border-radius: 5px;
        }

        #initial-loader .skeleton-navbar-links span:nth-child(2) { width: 51px; }
        #initial-loader .skeleton-navbar-links span:nth-child(3) { width: 83px; }
        #initial-loader .skeleton-navbar-links span:nth-child(4) { width: 74px; }
        #initial-loader .skeleton-navbar-links span:nth-child(5) { width: 43px; }

        #initial-loader .skeleton-navbar-actions {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-shrink: 0;
        }

        #initial-loader .skeleton-navbar-cart {
            width: 28px;
            height: 28px;
            border-radius: 7px;
        }

        #initial-loader .skeleton-navbar-whatsapp {
            width: 153px;
            height: 42px;
            border-radius: 25px;
        }

        #initial-loader .skeleton-navbar-menu {
            display: none;
            width: 28px;
            height: 28px;
            border-radius: 6px;
        }


        /* =========================================================
           HERO
           A área de imagem continua sem skeleton.
           ========================================================= */

        #initial-loader .skeleton-hero {
            position: relative;
            width: 100%;
            min-height: clamp(500px, 43vw, 600px);
            overflow: hidden;
            display: flex;
            align-items: center;
            background:
                linear-gradient(
                    110deg,
                    #0b0912 0%,
                    #160c20 52%,
                    #0d0916 100%
                );
        }

        #initial-loader .skeleton-hero-content {
            position: relative;
            z-index: 2;
            width: min(650px, 48%);
            padding-left: clamp(7%, 8vw, 11%);
        }

        #initial-loader .skeleton-hero-eyebrow {
            width: 105px;
            height: 12px;
            margin-bottom: 16px;
        }

        #initial-loader .skeleton-hero-title {
            width: min(470px,100%);
            height: clamp(40px,4vw,56px);
            margin-bottom: 9px;
        }

        #initial-loader .skeleton-hero-title.second {
            width: min(360px,78%);
        }

        #initial-loader .skeleton-hero-script {
            width: min(430px,90%);
            height: clamp(46px,5vw,68px);
            margin: 15px 0 24px;
            border-radius: 14px;
        }

        #initial-loader .skeleton-hero-description {
            width: min(450px,94%);
            height: 11px;
            margin-top: 8px;
        }

        #initial-loader .skeleton-hero-description.short {
            width: min(330px,70%);
        }

        #initial-loader .skeleton-hero-buttons {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 22px;
        }

        #initial-loader .skeleton-hero-button {
            width: 128px;
            height: 40px;
            border-radius: 22px;
        }

        #initial-loader .skeleton-hero-button.secondary {
            width: 116px;
        }


        /* =========================================================
           PRODUCTS — AJUSTADO
           ========================================================= */

        #initial-loader .skeleton-products {
            position: relative;
            width: 100%;
            padding: 55px 6%;
            background: #100d1d;
            overflow: hidden;
        }

        #initial-loader .skeleton-products-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: min(1160px, 100%);
            margin: 0 auto 28px;
        }

        #initial-loader .skeleton-products-copy {
            min-width: 0;
        }

        #initial-loader .skeleton-products-eyebrow {
            width: 105px;
            height: 10px;
            margin-bottom: 8px;
            border-radius: 5px;
        }

        #initial-loader .skeleton-products-title {
            width: 245px;
            height: 35px;
            margin: 0;
        }

        #initial-loader .skeleton-products-subtitle {
            width: 280px;
            height: 10px;
            margin-top: 9px;
        }

        #initial-loader .skeleton-products-see-all {
            width: 105px;
            height: 38px;
            border-radius: 22px;
            flex-shrink: 0;
        }

        /* Carrossel */
        #initial-loader .skeleton-products-carousel {
            position: relative;
            width: min(1160px, 100%);
            margin: 0 auto;
        }

        #initial-loader .skeleton-products-viewport {
            width: 100%;
            overflow: hidden;
        }

        #initial-loader .skeleton-products-track {
            display: flex;
            gap: 18px;
            width: 100%;
        }

        /* Desktop: 4 produtos */
        #initial-loader .skeleton-products-slide {
            flex: 0 0 calc((100% - 54px) / 4);
            min-width: 0;
        }

        /* Setas */
        /* As setas também são skeleton: somente o formato do botão,
           sem símbolo, seta ou traço interno. */
        #initial-loader .skeleton-products-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            z-index: 10;
            background: rgba(255,255,255,.075);
            overflow: hidden;
        }

        #initial-loader .skeleton-products-arrow::after {
            content: "";
            position: absolute;
            inset: 0;
            transform: translateX(-100%);
            background:
                linear-gradient(
                    90deg,
                    transparent 0%,
                    rgba(255,255,255,.025) 35%,
                    rgba(160,32,240,.12) 50%,
                    rgba(255,255,255,.025) 65%,
                    transparent 100%
                );
            animation: skeleton-shimmer 1.45s ease-in-out infinite;
        }

        #initial-loader .skeleton-products-arrow.left {
            left: -48px;
        }

        #initial-loader .skeleton-products-arrow.right {
            right: -48px;
        }

        /* =========================================================
           HOME PRODUCT CARD
           ========================================================= */

        #initial-loader .skeleton-home-product-card {
            display: block;
            width: 100%;
            overflow: hidden;
            background: #0d0a17;
            border: 1px solid rgba(160, 32, 240, 0.25);
            border-radius: 16px;
            color: white;
        }

        #initial-loader .skeleton-home-product-card-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
        }

        #initial-loader .skeleton-home-product-card-image .skeleton {
            width: 100%;
            height: 100%;
            border-radius: 0;
        }

        #initial-loader .skeleton-home-product-card-content {
            padding: 14px 16px 16px;
        }

        #initial-loader .skeleton-product-name {
            width: 68%;
            height: 16px;
            border-radius: 6px;
        }

        #initial-loader .skeleton-product-description {
            width: 94%;
            height: 10px;
            margin-top: 12px;
            border-radius: 5px;
        }

        #initial-loader .skeleton-product-description.short {
            width: 72%;
            margin-top: 6px;
        }

        #initial-loader .skeleton-home-product-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 16px;
        }

        #initial-loader .skeleton-product-price {
            width: 42%;
            height: 16px;
            border-radius: 6px;
        }

        #initial-loader .skeleton-product-add {
            width: 34px;
            height: 34px;
            border-radius: 50%;
        }

        /* Indicadores */
        #initial-loader .skeleton-products-dots {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            margin-top: 20px;
        }

        #initial-loader .skeleton-products-dots span {
            display: block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,.16);
        }

        #initial-loader .skeleton-products-dots span:first-child {
            width: 10px;
            height: 10px;
            background: rgba(160,32,240,.30);
        }

        /* =========================================================
           TABLET
           ========================================================= */

        @media (max-width:1000px) {
            #initial-loader .skeleton-products {
                padding: 50px 6%;
            }

            #initial-loader .skeleton-products-track {
                gap: 14px;
            }

            #initial-loader .skeleton-products-slide {
                flex-basis: calc((100% - 42px) / 4);
            }

            #initial-loader .skeleton-products-arrow.left {
                left: -32px;
            }

            #initial-loader .skeleton-products-arrow.right {
                right: -32px;
            }

            #initial-loader .skeleton-home-product-card-content {
                padding: 13px 14px 15px;
            }

            #initial-loader .skeleton-product-name,
            #initial-loader .skeleton-product-price {
                height: 15px;
            }

            #initial-loader .skeleton-product-add {
                width: 32px;
                height: 32px;
            }
        }

        /* =========================================================
           MOBILE <= 792px
           2 PRODUTOS LADO A LADO
           ========================================================= */

        @media (max-width:792px) {
            #initial-loader .skeleton-products {
                padding: 55px 6% 85px;
            }

            #initial-loader .skeleton-products-heading {
                margin-bottom: 30px;
            }

            #initial-loader .skeleton-products-title {
                width: 205px;
                height: 28px;
            }

            #initial-loader .skeleton-products-subtitle {
                width: 270px;
                max-width: 90%;
                height: 8px;
                margin-top: 8px;
            }

            #initial-loader .skeleton-products-see-all {
                width: 95px;
                height: 35px;
            }

            #initial-loader .skeleton-products-track {
                gap: 12px;
            }

            /* 2 cards visíveis */
            #initial-loader .skeleton-products-slide {
                flex: 0 0 calc((100% - 12px) / 2);
            }

            #initial-loader .skeleton-products-arrow {
                width: 34px;
                height: 34px;
            }

            #initial-loader .skeleton-products-arrow.left {
                left: -22px;
            }

            #initial-loader .skeleton-products-arrow.right {
                right: -22px;
            }

            #initial-loader .skeleton-home-product-card {
                border-radius: 14px;
            }

            #initial-loader .skeleton-home-product-card-content {
                padding: 12px;
            }

            #initial-loader .skeleton-product-name {
                height: 14px;
            }

            #initial-loader .skeleton-product-description {
                font-size: 11px;
                margin-top: 9px;
            }

            #initial-loader .skeleton-product-price {
                height: 14px;
            }

            #initial-loader .skeleton-product-add {
                width: 32px;
                height: 32px;
            }
        }

        /* =========================================================
           CELULAR <= 480px
           Mantém 2 produtos lado a lado.
           ========================================================= */

        @media (max-width:480px) {
            #initial-loader .skeleton-products {
                padding: 52px 5% 80px;
            }

            #initial-loader .skeleton-products-heading {
                display: flex;
                align-items: flex-start;
                margin-bottom: 28px;
            }

            #initial-loader .skeleton-products-title {
                width: 190px;
                height: 27px;
            }

            #initial-loader .skeleton-products-subtitle {
                width: 290px;
                max-width: 100%;
                height: 8px;
            }

            #initial-loader .skeleton-products-see-all {
                width: 88px;
                height: 34px;
            }

            #initial-loader .skeleton-products-carousel {
                width: 100%;
            }

            #initial-loader .skeleton-products-track {
                gap: 10px;
            }

            /* 2 cards lado a lado também no celular */
            #initial-loader .skeleton-products-slide {
                flex: 0 0 calc((100% - 10px) / 2);
            }

            #initial-loader .skeleton-products-arrow {
                width: 30px;
                height: 30px;
            }

            #initial-loader .skeleton-products-arrow.left {
                left: -15px;
            }

            #initial-loader .skeleton-products-arrow.right {
                right: -15px;
            }

            #initial-loader .skeleton-home-product-card-content {
                padding: 10px;
            }

            #initial-loader .skeleton-product-name {
                height: 14px;
            }

            #initial-loader .skeleton-product-description {
                height: 8px;
                margin-top: 8px;
            }

            #initial-loader .skeleton-product-description.short {
                margin-top: 5px;
            }

            #initial-loader .skeleton-home-product-card-footer {
                margin-top: 12px;
            }

            #initial-loader .skeleton-product-price {
                height: 14px;
            }

            #initial-loader .skeleton-product-add {
                width: 30px;
                height: 30px;
            }

            #initial-loader .skeleton-products-dots {
                margin-top: 18px;
            }
        }

        /* =========================================================
           CELULAR PEQUENO <= 380px
           ========================================================= */

        @media (max-width:380px) {
            #initial-loader .skeleton-products {
                padding-left: 5%;
                padding-right: 5%;
            }

            #initial-loader .skeleton-products-slide {
                flex-basis: calc((100% - 8px) / 2);
            }

            #initial-loader .skeleton-products-track {
                gap: 8px;
            }

            #initial-loader .skeleton-home-product-card-content {
                padding: 9px;
            }

            #initial-loader .skeleton-product-add {
                width: 28px;
                height: 28px;
            }
        }

        /* =========================================================
           COMO FAZER
           ========================================================= */

        #initial-loader .skeleton-how {
            width: 100%;
            padding: 90px 8%;
            background: #100d1d;
        }

        #initial-loader .skeleton-how-inner {
            width: min(1160px,100%);
            margin: 0 auto;
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: clamp(40px,6vw,80px);
            align-items: center;
        }

        #initial-loader .skeleton-how-eyebrow {
            width: 105px;
            height: 9px;
            margin-bottom: 13px;
        }

        #initial-loader .skeleton-how-title {
            width: 155px;
            height: 29px;
        }

        #initial-loader .skeleton-how-title.second {
            width: 120px;
            height: 28px;
            margin-top: 7px;
        }

        #initial-loader .skeleton-how-steps {
            display: grid;
            grid-template-columns: repeat(4,minmax(0,1fr));
            gap: 22px;
        }

        #initial-loader .skeleton-how-step {
            position: relative;
        }

        #initial-loader .skeleton-how-icon {
            width: 31px;
            height: 31px;
            margin-bottom: 12px;
            border-radius: 7px;
        }

        #initial-loader .skeleton-how-number {
            position: absolute;
            top: 8px;
            left: 41px;
            width: 22px;
            height: 9px;
        }

        #initial-loader .skeleton-how-step-title {
            width: 90%;
            height: 11px;
        }

        #initial-loader .skeleton-how-text {
            width: 94%;
            height: 8px;
            margin-top: 8px;
        }

        #initial-loader .skeleton-how-text.short {
            width: 70%;
            margin-top: 5px;
        }


        /* =========================================================
           SOBRE
           ========================================================= */

        #initial-loader .skeleton-about {
            position: relative;
            width: 100%;
            min-height: 365px;
            padding: 80px 8%;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 50% 50%,
                    rgba(126,14,157,.08),
                    transparent 42%
                ),
                #100d1d;
        }

        #initial-loader .skeleton-about-inner {
            position: relative;
            z-index: 2;
            width: min(1160px,100%);
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(320px,1.1fr) minmax(300px,.9fr);
            gap: 80px;
            align-items: center;
        }

        #initial-loader .skeleton-about-eyebrow {
            width: 70px;
            height: 8px;
            margin-bottom: 14px;
        }

        #initial-loader .skeleton-about-title {
            width: 340px;
            height: 28px;
        }

        #initial-loader .skeleton-about-title.second {
            width: 315px;
            margin-top: 7px;
        }

        #initial-loader .skeleton-about-text {
            width: 520px;
            max-width: 100%;
            height: 9px;
            margin-top: 20px;
        }

        #initial-loader .skeleton-about-text.second {
            width: 465px;
            margin-top: 7px;
        }

        #initial-loader .skeleton-about-button {
            width: 135px;
            height: 32px;
            margin-top: 20px;
            border-radius: 18px;
        }

        #initial-loader .skeleton-about-features {
            display: grid;
            grid-template-columns: repeat(2,minmax(0,1fr));
            gap: 25px 40px;
        }

        #initial-loader .skeleton-feature {
            display: grid;
            grid-template-columns: 30px 1fr;
            gap: 10px;
            align-items: start;
        }

        #initial-loader .skeleton-feature-icon {
            width: 25px;
            height: 25px;
            border-radius: 7px;
        }

        #initial-loader .skeleton-feature-title {
            width: 92px;
            height: 8px;
        }

        #initial-loader .skeleton-feature-text {
            width: 78px;
            height: 7px;
            margin-top: 6px;
        }


        /* =========================================================
           FOOTER
           Baseado no .footer real:
           padding 28px 6% 14px, main flex e bottom line.
           ========================================================= */

        #initial-loader .skeleton-footer {
            position: relative;
            width: 100%;
            padding: 28px 6% 14px;
            background:
                linear-gradient(
                    90deg,
                    #09000f,
                    #1b0028,
                    #09000f
                );
            border-top: 1px solid rgba(160,32,240,.12);
            overflow: hidden;
        }

        #initial-loader .skeleton-footer-main {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 1160px;
            margin: 0 auto;
        }

        #initial-loader .skeleton-footer-logo {
            width: 90px;
            height: 30px;
            flex-shrink: 0;
        }

        #initial-loader .skeleton-footer-navigation {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 23px;
            margin-left: 35px;
        }

        #initial-loader .skeleton-footer-navigation span {
            width: 38px;
            height: 7px;
        }

        #initial-loader .skeleton-footer-navigation span:nth-child(2) { width: 52px; }
        #initial-loader .skeleton-footer-navigation span:nth-child(3) { width: 73px; }
        #initial-loader .skeleton-footer-navigation span:nth-child(4) { width: 62px; }
        #initial-loader .skeleton-footer-navigation span:nth-child(5) { width: 38px; }

        #initial-loader .skeleton-footer-contact {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-left: 30px;
            flex-shrink: 0;
        }

        #initial-loader .skeleton-footer-social {
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }

        #initial-loader .skeleton-footer-location {
            width: 112px;
            height: 7px;
        }

        #initial-loader .skeleton-footer-bottom {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 1160px;
            margin: 20px auto 0;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,.07);
        }

        #initial-loader .skeleton-footer-bottom span {
            width: 105px;
            height: 7px;
        }

        #initial-loader .skeleton-footer-bottom span:last-child {
            width: 125px;
        }


        /* =========================================================
           TABLET
           ========================================================= */

        @media (max-width:1000px) {

            #initial-loader .skeleton-navbar {
                padding: 0 30px;
            }

            #initial-loader .skeleton-navbar-links {
                gap: 20px;
                margin-right: 20px;
            }

            #initial-loader .skeleton-navbar-links span {
                width: 40px;
            }

            #initial-loader .skeleton-navbar-links span:nth-child(2) { width: 48px; }
            #initial-loader .skeleton-navbar-links span:nth-child(3) { width: 70px; }
            #initial-loader .skeleton-navbar-links span:nth-child(4) { width: 64px; }

            #initial-loader .skeleton-navbar-whatsapp {
                width: 125px;
                height: 38px;
            }

            #initial-loader .skeleton-products {
                padding: 50px 6% 105px;
            }

            #initial-loader .skeleton-products-heading {
                margin-bottom: 28px;
            }

            #initial-loader .skeleton-products-title {
                height: 31px;
            }

            #initial-loader .skeleton-products-carousel {
                max-width: 1000px;
            }

            #initial-loader .skeleton-products-track {
                gap: 14px;
            }

            #initial-loader .skeleton-products-slide {
                flex-basis: calc((100% - 28px) / 3);
            }

            #initial-loader .skeleton-products-arrow.left {
                left: -32px;
            }

            #initial-loader .skeleton-products-arrow.right {
                right: -32px;
            }

            #initial-loader .skeleton-home-product-card-content {
                padding: 13px 14px 15px;
            }

            #initial-loader .skeleton-product-name {
                height: 15px;
            }

            #initial-loader .skeleton-product-price {
                height: 15px;
            }

    <script>
        const initialLoader =
            document.getElementById('initial-loader')

        const root =
            document.getElementById('root')

        const hideInitialLoader = () => {
            if (!initialLoader) return

            initialLoader.classList.add('hidden')
        }

        const observer =
            new MutationObserver(() => {
                if (root && root.hasChildNodes()) {
                    hideInitialLoader()
                    observer.disconnect()
                }
            })

        if (root) {
            observer.observe(
                root,
                {
                    childList: true,
                    subtree: true
                }
            )
        }
